
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Checkstyle
        run: mvn -B checkstyle:check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Validate phase labels
        id: phase
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "mode=tests" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count=$(echo "$LABELS" | jq \
            '[.[] | .name | select(. == "phase:tests" or . == "phase:fix")] | length')

          if [ "$count" -ne 1 ]; then
            echo "::error::Exactly one phase label is required"
            exit 1
          fi

          if echo "$LABELS" | jq -e \
            '.[] | select(.name == "phase:fix")' > /dev/null; then
            echo "mode=fix" >> "$GITHUB_OUTPUT"
          else
            echo "mode=tests" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests (informational)
        if: steps.phase.outputs.mode == 'tests'
        run: mvn -B -Dmaven.test.failure.ignore=true test

      - name: Run tests (strict)
        if: steps.phase.outputs.mode == 'fix'
        run: mvn -B test

      - name: Publish JUnit and coverage reports
        if: always()
        run: |
          echo "JUnit results:"
          find target/surefire-reports -name 'TEST-*.xml' \
            -print 2>/dev/null || true

          echo "JaCoCo coverage:"
          ls target/site/jacoco/ 2>/dev/null || true
