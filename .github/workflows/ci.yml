name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Checkstyle
        run: mvn -B checkstyle:check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Validate phase labels
        id: phase
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "mode=tests" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count=$(echo "$LABELS" | jq \
            '[.[] | .name | select(. == "phase:tests" or . == "phase:fix")] | length')

          if [ "$count" -ne 1 ]; then
            echo "::error::Exactly one phase label is required"
            exit 1
          fi

          if echo "$LABELS" | jq -e \
            '.[] | select(.name == "phase:fix")' > /dev/null; then
            echo "mode=fix" >> "$GITHUB_OUTPUT"
          else
            echo "mode=tests" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests (informational)
        if: steps.phase.outputs.mode == 'tests'
        run: mvn -B -Dmaven.test.failure.ignore=true test

      - name: Run tests (strict)
        if: steps.phase.outputs.mode == 'fix'
        run: mvn -B test

      - name: Generate coverage even after strict test failures
        if: always() && steps.phase.outputs.mode != ''
        continue-on-error: true
        run: mvn -B jacoco:report

      - name: Prepare informational reports
        if: always() && steps.phase.outputs.mode != ''
        continue-on-error: true
        run: python3 scripts/ci_reports.py

      - name: Upload JUnit and coverage reports
        if: always() && steps.phase.outputs.mode != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/*-comment.md
            target/junit-results.md
          if-no-files-found: warn

      - name: Comment JUnit and coverage on PR
        if: always() && github.event_name == 'pull_request' && steps.phase.outputs.mode != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = {...context.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            for (const kind of ['junit', 'coverage']) {
              const path = `target/${kind}-comment.md`;
              if (!fs.existsSync(path)) continue;
              const body = fs.readFileSync(path, 'utf8') +
                `\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const marker = `<!-- cs4472-${kind} -->`;
              const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo, comment_id: existing.id, body
                });
              } else {
                await github.rest.issues.createComment({...issue, body});
              }
            }
